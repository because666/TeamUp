[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "teamup-api"
version = "0.1.0"
description = "TeamUp FastAPI backend foundation"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.136.1",
  "pydantic==2.13.3",
  "httpx==0.28.1",
  "uvicorn[standard]==0.46.0",
  "SQLAlchemy==2.0.51",
  "alembic==1.19.1",
  "PyMySQL==1.2.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

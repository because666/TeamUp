name: TeamUp API CI

on:
  push:
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: teamup_ci_root
          MYSQL_DATABASE: teamup_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pteamup_ci_root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEAMUP_DATABASE_URL: mysql+pymysql://root:teamup_ci_root@127.0.0.1:3306/teamup_ci?charset=utf8mb4
      TEAMUP_TEST_MYSQL_URL: mysql+pymysql://root:teamup_ci_root@127.0.0.1:3306/teamup_ci?charset=utf8mb4
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m alembic upgrade head
      - run: python -m pytest
      - run: python -m compileall -q app tests migrations
      - run: git diff --check
